<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My AI Learning Journey</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="A personal, growing knowledge base documenting what I learn about AI — agents, context engineering, RAG, prompting, and foundations." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <!-- Apply saved theme before paint to avoid a flash (default: dark) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute(
          'data-theme', (saved === 'light' || saved === 'dark') ? saved : 'dark'
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Docsify theme (base) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <!-- Custom styling: right-hand sidebar + polish -->
  <link rel="stylesheet" href="assets/custom.css" />
</head>
<body>
  <!-- Light / dark theme toggle -->
  <button id="theme-toggle" type="button" aria-label="Toggle light and dark theme" title="Toggle light / dark">
    <span class="icon-sun" aria-hidden="true">☀</span>
    <span class="icon-moon" aria-hidden="true">☾</span>
  </button>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
  <div id="app">Loading…</div>
  <script>
    window.$docsify = {
      name: 'My AI Learning Journey',
      loadSidebar: true,
      loadNavbar: false,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 0,
      maxLevel: 4,
      auto2top: true,
      // false: sidebar links are resolved from the site root. With `true`, a link
      // like `folder/note.md` clicked while already inside `/folder/` resolves to
      // `/folder/folder/note.md` → 404.
      relativePath: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: 'Search the knowledge base…',
        noData: 'No results found.',
        depth: 4
      },
      pagination: {
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      }
    };
  </script>
  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- Syntax highlighting for common languages -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
